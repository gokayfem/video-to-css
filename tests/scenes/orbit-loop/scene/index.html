<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signal orbit (strict CSS)</title>
  <link rel="stylesheet" href="scene.css">
  <style>body { margin: 0; }</style>
</head>
<body>
  <div class="v2c-orbit" role="img" aria-label="An orange dot orbits a pulsing teal ring; a purple tile turns in quarter steps; three yellow bars pulse in sequence.">
    <div class="v2c-orbit__hub">
      <div class="v2c-orbit__ring"></div>
      <div class="v2c-orbit__core"></div>
      <div class="v2c-orbit__arm">
        <div class="v2c-orbit__dot"></div>
      </div>
    </div>
    <div class="v2c-orbit__tile">
      <div class="v2c-orbit__tile-spin">
        <div class="v2c-orbit__tile-face"></div>
      </div>
    </div>
    <div class="v2c-orbit__bars">
      <i class="v2c-orbit__bar"></i>
      <i class="v2c-orbit__bar"></i>
      <i class="v2c-orbit__bar"></i>
    </div>
  </div>
</body>
</html>
