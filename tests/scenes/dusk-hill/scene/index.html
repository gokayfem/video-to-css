<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dusk hill (strict CSS reconstruction)</title>
  <link rel="stylesheet" href="scene.css">
  <style>body { margin: 0; }</style>
</head>
<body>
  <div class="v2c-dusk" role="img" aria-label="Windmill on a hill at dusk: the sun sets behind a far hill, a bird flies past and the sails slow to a stop">
    <div class="v2c-dusk__sky"></div>
    <div class="v2c-dusk__sun-track"><div class="v2c-dusk__sun"></div></div>
    <div class="v2c-dusk__dusk"></div>
    <div class="v2c-dusk__hill-back"></div>
    <div class="v2c-dusk__hill-front"></div>
    <div class="v2c-dusk__mill">
      <div class="v2c-dusk__tower"></div>
      <div class="v2c-dusk__rotor">
        <i class="v2c-dusk__blade v2c-dusk__blade--h"></i>
        <i class="v2c-dusk__blade v2c-dusk__blade--v"></i>
      </div>
      <div class="v2c-dusk__hub"></div>
    </div>
    <div class="v2c-dusk__bird">
      <div class="v2c-dusk__bird-bob">
        <i class="v2c-dusk__wing v2c-dusk__wing--l"></i>
        <i class="v2c-dusk__wing v2c-dusk__wing--r"></i>
      </div>
    </div>
  </div>
</body>
</html>
