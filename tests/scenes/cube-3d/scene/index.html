<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spinning cube (simple 3D loop)</title>
<link rel="stylesheet" href="scene.css">
<style>body{margin:0}</style>
</head>
<body>
<div class="v2c-cube" role="img" aria-label="A floating cube with coloured faces spinning over its shadow">
  <i class="v2c-cube__shadow"></i>
  <div class="v2c-cube__bob">
    <div class="v2c-cube__tilt">
      <div class="v2c-cube__spin">
        <b class="v2c-cube__face v2c-cube__face--front"></b>
        <b class="v2c-cube__face v2c-cube__face--left"></b>
        <b class="v2c-cube__face v2c-cube__face--back"></b>
        <b class="v2c-cube__face v2c-cube__face--right"></b>
        <b class="v2c-cube__face v2c-cube__face--top"></b>
        <b class="v2c-cube__face v2c-cube__face--bottom"></b>
      </div>
    </div>
  </div>
</div>
</body>
</html>
